<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSYCHO</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Logo (optional) -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo" class="logo" />
  </div>

  <!-- Floating scroll -->
  <img src="scroll.png" alt="Scroll" class="scroll-icon" onclick="openPopup()" />

  <!-- Popup -->
  <div id="popup" class="popup-overlay" onclick="closePopup(event)">
    <div class="popup-content">
      <img src="popup.png" alt="Popup" class="popup-image" />
    </div>
  </div>

  <!-- Script to open/close popup -->
  <script>
    function openPopup() {
      document.getElementById('popup').style.display = 'flex';
    }

    function closePopup(event) {
      const popupImage = document.querySelector('.popup-image');
      const bounds = popupImage.getBoundingClientRect();
      const x = event.clientX;
      const y = event.clientY;
      const closeZone = {
        x: bounds.right - 80,
        y: bounds.top + 20,
        w: 60,
        h: 60
      };
      const insideClose =
        x >= closeZone.x &&
        x <= closeZone.x + closeZone.w &&
        y >= closeZone.y &&
        y <= closeZone.y + closeZone.h;

      if (event.target.id === 'popup' || insideClose) {
        document.getElementById('popup').style.display = 'none';
      }
    }

    // Security: Block right-click + key combos
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && ['u', 's', 'Shift'].includes(e.key.toLowerCase()))
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
